name: source-checks

on:
  push:
  pull_request:

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q recomp tools
      - run: python tools/test_build_vita_audio_contract.py
      - run: python tools/build_vita.py --self-test
      - run: python tools/test_release_audit.py
